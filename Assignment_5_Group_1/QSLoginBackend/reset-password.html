<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueueSmart - Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="QSLoginScreen.css">
</head>
<body>

<div class="phone">
    <div class="screen">
        <div class="notch"></div>
        <div class="header-flow">
            <img src="../QueueSmartLogo.png" alt="QueueSmart logo" class="logo">
            <div class="wave">
                <svg viewBox="0 0 260 22" width="100%" height="22" preserveAspectRatio="none">
                <path d="M0,12 C18,12 20,4 38,4 C58,4 60,16 82,16 C106,16 108,8 134,8 C162,8 168,13 200,13 C224,13 230,10 260,10"/>
                </svg>
            </div>
        </div>
        
        <p class="eyebrow">QueueSmart</p>
        <h1>Set a New Password</h1>
        <p class="sub">Enter a new password for your account.</p>

        <form id="resetForm" onsubmit="return handleResetPassword(event)">
            <div class="field">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="8-20 characters" maxlength="20">
                <div class="errmsg" id="newPasswordErr"></div>
            </div>
            <div class="field">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="8-20 characters" maxlength="20">
                <div class="errmsg" id="confirmPasswordErr"></div>
            </div>
            <button type="submit" class="submit">Reset Password</button>
        </form>

        <div class="toast" id="toast"></div>
    </div>
</div>

<script src="reset-password.js"></script>
</body>
</html>
